</head>

<body>

<form>

<h1>Student Registration Form</h1>

<fieldset>
<legend>Personal Information</legend>

<label>Full Name:</label> <input type="text" placeholder="Enter your full name" required>

<label>Email:</label> <input type="email" placeholder="Enter your email" required>

<label>Password:</label> <input type="password" placeholder="Enter a password" required>

<label>Age:</label> <input type="number" min="10" max="100">

<label>Birthday:</label> <input type="date">

<label>Gender:</label><br> <input type="radio" name="gender"> Male <input type="radio" name="gender"> Female <input type="radio" name="gender"> Prefer not to say

</fieldset>

<br>

<fieldset>
<legend>School Information</legend>

<label>Grade Level:</label> <select> <option>Select Grade</option> <option>Grade 7</option> <option>Grade 8</option> <option>Grade 9</option> <option>Grade 10</option> <option>Grade 11</option> <option>Grade 12</option> </select>

<label>Favorite Subject:</label> <input type="text" placeholder="Enter your favorite subject">

<label>Hobbies:</label><br> <input type="checkbox"> Basketball <input type="checkbox"> Gaming <input type="checkbox"> Cooking <input type="checkbox"> Music

</fieldset>

<br>

<fieldset>
<legend>Additional Information</legend>

<label>Why are you joining?</label>

<textarea rows="5" placeholder="Write your answer here..."></textarea>

<label>Choose your favorite color:</label> <input type="color">

</fieldset>

<br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
